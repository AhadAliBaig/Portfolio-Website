server {
    listen 80;
    server_name ahadalibaig.me;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    location / {
        try_files $uri $uri/ /index.html;
    }
}